<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report an Issue - Cloud Forum</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background: #f0f2f5; display: flex; }
    .sidebar { width: 200px; background: #2b2b2b; color: #fff; padding: 20px; height: 100vh; box-sizing: border-box; }
    .sidebar h2 { font-size: 1.1rem; margin-top: 0; }
    .sidebar nav a { color: #ccc; text-decoration: none; display: block; margin: 10px 0; }
    .main { flex: 1; padding: 40px; overflow-y: auto; }
    .card { background: #fff; border-radius: 8px; padding: 30px; max-width: 700px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stepper { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .step { flex: 1; text-align: center; position: relative; }
    .step:not(:last-child)::after { content: ''; position: absolute; top: 12px; right: -50%; width: 100%; height: 2px; background: #ccc; z-index: -1; }
    .step-number { width: 24px; height: 24px; border-radius: 50%; background: #ccc; margin: auto; color: #fff; line-height: 24px; }
    .step.active .step-number { background: #0078d4; }
    .step-label { margin-top: 8px; font-size: 0.9rem; color: #555; }
    .step.active .step-label { color: #0078d4; }
    label { display: block; margin: 20px 0 5px; font-weight: bold; }
    input[type='text'], input[type='datetime-local'], select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    textarea { resize: vertical; height: 80px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 200px; }
    .actions { display: flex; justify-content: space-between; margin-top: 30px; }
    .button { padding: 12px 24px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    .button.primary { background: #0078d4; color: #fff; }
    .button.secondary { background: #f0f0f0; color: #333; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Cloud Forum</h2>
    <nav>
      <a href="#submit">Report Issue</a>
      <a href="#recent">Recent Posts</a>
      <a href="#guidelines">Guidelines</a>
      <a href="#faq">FAQ</a>
    </nav>
  </aside>
  <main class="main">
    <div class="card">
      <div class="stepper">
        <div class="step active">
          <div class="step-number">1</div>
          <div class="step-label">Core Details</div>
        </div>
        <div class="step">
          <div class="step-number">2</div>
          <div class="step-label">Additional Context</div>
        </div>
      </div>
      <form id="issueForm">
        <!-- Step 1 -->
        <div id="step1">
          <label for="summary">Describe the problem in one sentence</label>
          <input type="text" id="summary" name="summary" placeholder="e.g. 'API returns 500 on upload'" required />

          <label for="timestamp">When did it start?</label>
          <input type="datetime-local" id="timestamp" name="timestamp" required />

          <div class="row">
            <div class="col">
              <label for="provider">Cloud Provider</label>
              <select id="provider" name="provider" required>
                <option value="aws">Amazon Web Services (AWS)</option>
                <option value="azure">Microsoft Azure</option>
                <option value="gcp">Google Cloud Platform (GCP)</option>
                <option value="ibm">IBM Cloud</option>
                <option value="oci">Oracle Cloud Infrastructure (OCI)</option>
                <option value="alibaba">Alibaba Cloud</option>
                <option value="salesforce">Salesforce</option>
                <option value="vmware">VMware Cloud</option>
                <option value="rackspace">Rackspace</option>
                <option value="digitalocean">DigitalOcean</option>
                <option value="hpe">HPE</option>
                <option value="openshift">Red Hat OpenShift</option>
                <option value="sap">SAP</option>
                <option value="servicenow">ServiceNow</option>
                <option value="cisco">Cisco Cloud</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col">
              <label for="service">Affected Service</label>
              <input type="text" id="service" name="service" placeholder="e.g. S3, Azure VM, Pub/Sub" required />
            </div>
          </div>

          <label for="urgency">Urgency Level</label>
          <select id="urgency" name="urgency" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>

          <div class="actions">
            <button type="button" class="button secondary" id="nextBtn">Next: More Context</button>
            <button type="submit" class="button primary">Submit Issue</button>
          </div>
        </div>

        <!-- Step 2 (Hidden by default) -->
        <div id="step2" style="display:none;">
          <label for="components">Affected Components (optional)</label>
          <input type="text" id="components" name="components" placeholder="e.g. web-frontend, database" />

          <label for="category">Issue Category</label>
          <select id="category" name="category" required>
            <option value="performance">Performance</option>
            <option value="availability">Availability</option>
            <option value="security">Security</option>
            <option value="config">Configuration</option>
            <option value="integration">Integration</option>
            <option value="other">Other</option>
          </select>

          <label for="region">Affected Region (optional)</label>
          <input type="text" id="region" name="region" placeholder="e.g. us-east-1, eu-west-2" />

          <label for="details">Attach Logs or Screenshots (optional)</label>
          <input type="file" id="details" name="details" accept=".txt,.log,.png,.jpg" />

          <label for="description">Detailed Description (optional)</label>
          <textarea id="description" name="description" placeholder="Any additional details..."></textarea>

          <div class="actions">
            <button type="button" class="button secondary" id="backBtn">Back</button>
            <button type="submit" class="button primary">Submit Issue</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const steps = document.querySelectorAll('.step');

    nextBtn.addEventListener('click', () => {
      step1.style.display = 'none';
      step2.style.display = 'block';
      steps[1].classList.add('active');
    });
    backBtn.addEventListener('click', () => {
      step2.style.display = 'none';
      step1.style.display = 'block';
      steps[1].classList.remove('active');
    });

    document.getElementById('issueForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Collect form data and submit
      alert('Issue submitted successfully!');
      // Reset or redirect as needed
    });
  </script>
</body>
</html>
